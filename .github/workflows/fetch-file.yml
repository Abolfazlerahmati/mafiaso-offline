name: fetch-file

# Temporary helper: downloads a public URL and publishes it as a tag split
# into <100MB parts (for networks that only allow github.com/codeload).

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to fetch
        required: true
      name:
        description: Output file name
        default: file.bin

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download
        env:
          URL: ${{ github.event.inputs.url }}
          NAME: ${{ github.event.inputs.name }}
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 -A 'Mozilla/5.0 (Linux; Android 13)' -o "out/$NAME" "$URL"
          ls -la out
          file "out/$NAME" || true
          head -c 500 "out/$NAME" || true

      - name: Publish as tag
        env:
          NAME: ${{ github.event.inputs.name }}
        run: |
          set -euxo pipefail
          cd out
          split -b 90m -d -a 2 "$NAME" part-
          ls -la
          cd ..
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git checkout --orphan file-parts
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf .github
          cp out/part-* .
          git add part-*
          git commit -m "file parts"
          git push origin HEAD:refs/tags/file-parts --force
          echo "PUBLISHED"
