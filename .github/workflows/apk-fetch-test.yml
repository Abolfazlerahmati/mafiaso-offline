name: apk-fetch-test
on:
  push:
    branches: [ arena/95d7dd6d-mafiaso-offline ]
    paths: [ '.github/workflows/apk-fetch-test.yml' ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create test file
        run: echo "artifact-ok $(date -u +%FT%TZ)" > test.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-test
          path: test.txt
